<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBoxLayout</title>
    <link rel="stylesheet" href="FlexBoxLayout.css">
</head>
<body>
    <div id="course_headings_container">
        <h1 class="course_headings">CoreJava</h1>
        <h1 class="course_headings">WebDevelopment</h1>
        <h1 class="course_headings">SQL</h1>
        <h1 class="course_headings">AdvancedJava</h1>
        <h1 class="course_headings">Aptitude</h1>
    </div>
    <div id="circular_blocks_container">
        <div class="circular_blocks"></div>
        <div class="circular_blocks"></div>
        <div class="circular_blocks"></div>
    </div>
    <div id="rectangle_blocks_container">
        <div class="rectangle_blocks"></div>
        <div class="rectangle_blocks"></div>
        <div class="rectangle_blocks"></div>
        <div class="rectangle_blocks"></div>
        <div class="rectangle_blocks"></div>
    </div>
    <div id="roman_number_headings_container">
        <h1 class="roman_number_headings">I</h1>
        <h1 class="roman_number_headings">II</h1>
        <h1 class="roman_number_headings">III</h1>
        <h1 class="roman_number_headings">IV</h1>
        <h1 class="roman_number_headings">V</h1>
    </div>
    <div id="square_blocks_container">
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
        <div class="square_blocks"></div>
    </div>
    <div id="number_headings_container">
        <h1 class="number_headings">One</h1>
        <h1 class="number_headings">Two</h1>
        <h1 class="number_headings">Three</h1>
        <h1 class="number_headings">Four</h1>
        <h1 class="number_headings">Five</h1>
        <h1 class="number_headings">Six</h1>
        <h1 class="number_headings">Seven</h1>
        <h1 class="number_headings">Eight</h1>
        <h1 class="number_headings">Nine</h1>
        <h1 class="number_headings">Ten</h1>
        <h1 class="number_headings">Eleven</h1>
        <h1 class="number_headings">Twelve</h1>
        <h1 class="number_headings">Thirteen</h1>
        <h1 class="number_headings">Fourteen</h1>
        <h1 class="number_headings">Fifteen</h1>
    </div>
</body>
</html>
