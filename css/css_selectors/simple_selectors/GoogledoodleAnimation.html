<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoogleDoodleAnimation</title>
    <link rel="stylesheet" href="GoogleDoodleAnimation.css">
</head>
<body>
    <center>
        <div id="google_doodle_blocks_container">
            <div class="google_doodle_blocks royal_blue_texts">
                <marquee behavior="alternate" direction="down" scrollamount="50" class="google_doodle_marquees">G</marquee>
            </div>
            <div class="google_doodle_blocks red_texts">
                <marquee behavior="alternate" direction="down" scrollamount="45" class="google_doodle_marquees">o</marquee>
            </div>
            <div class="google_doodle_blocks" id="o_doodle">
                <marquee behavior="alternate" direction="down" scrollamount="40" class="google_doodle_marquees">o</marquee>
            </div>
            <div class="google_doodle_blocks royal_blue_texts">
                <marquee behavior="alternate" direction="down" scrollamount="35" class="google_doodle_marquees">g</marquee>
            </div>
            <div class="google_doodle_blocks" id="l_doodle">
                <marquee behavior="alternate" direction="down" scrollamount="30" class="google_doodle_marquees">l</marquee>
            </div>
            <div class="google_doodle_blocks red_texts">
                <marquee behavior="alternate" direction="down" scrollamount="27" class="google_doodle_marquees">e</marquee>
            </div>
        </div>
    </center>
</body>
</html>
