<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TacoBellWebPage</title>
    <link rel="stylesheet" href="TacoBellWebPage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <header id="tacobell_header_container">
        <div id="tacobell_icon_logo_container">
            <span class="icon_logo_containers" id="icon_container">
                <i class="fa-solid fa-bell" id="tacobell_icon"></i>
            </span>
            <span class="icon_logo_containers" id="logo_container">
                <span id="logo">TacoBell</span>
            </span>
        </div>
        <div id="home_logo_icon_container">
            <span class="home_logo_icon_containers" id="home_icon_container">
                <i class="fa-solid fa-home"></i>
            </span>
            <span class="home_logo_icon_containers" id="home_logo_container">Home</span>
        </div>
    </header>
    <nav id="tacobell_navigation_bar">
        <a href="" class="tacobell_navigation_bar_hyperlinks">Home</a>
        <a href="" class="tacobell_navigation_bar_hyperlinks">About</a>
        <a href="" class="tacobell_navigation_bar_hyperlinks">Products</a>
        <a href="" class="tacobell_navigation_bar_hyperlinks">Recipies</a>
        <a href="" class="tacobell_navigation_bar_hyperlinks">LOGIN</a>
    </nav>
</body>
</html>
