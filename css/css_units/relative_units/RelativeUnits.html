<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RelativeUnits</title>
    <link rel="stylesheet" href="RelativeUnits.css">
</head>
<body>
    <!-- percentage unit -->
    <div id="purple_color_block">
        <div id="white_color_block"></div>
    </div>
    <!-- viewport units -->
    <div id="navy_color_block">
        <div id="lightgray_color_block"></div>
    </div>
    <!-- rem unit and em unit -->
    <div id="parent_element">
        <span id="parent_content">Parent</span>
        <div id="child_element">
            <span id="child_content">Child</span>
        </div>
    </div>
</body>
</html>
