<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueeTag</title>
</head>
<body>

    <marquee behavior="scroll"
             direction="left"
             scrollamount="30"
             loop="5"
             style="font-size: 50px;
                    font-family: sans-serif;
                    color: white;
                    background-color: red;">
        ScrollableContent
    </marquee>

    <marquee behavior=""
             direction="up"
             style="font-size: 50px;
                    font-family: sans-serif;
                    color: white;
                    background-color: purple;">
        WebDevelopment is the process of designing and developing the
        front-end of the web pages by using HTML, CSS, JavaScript and
        ReactJavaScript.
    </marquee>

</body>
</html>
