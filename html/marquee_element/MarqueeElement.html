<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarqueeElement</title>
</head>
<body>
    <!--
    1.behavior="scroll(default value) | alternate | slide"
    2.direction="left(default value) | up | right | down"
    3.scrollamount="6(default value) | speed value in numbers"
    4.loop="infinite(default value) | repeatation count in numbers"
    -->
    <marquee behavior="scroll" direction="left" scrollamount="30" loop="5" style="font-size: 50px;font-family: sans-serif;color: white;background-color: red;">
        ScrollableContent
    </marquee>
    <marquee behavior="" direction="up" style="font-size: 50px;font-family: sans-serif;color: white;background-color: purple;">
        WebDevelopment is the process of designing and developing the front-end of the web pages by using HTML, CSS, JavaScript and ReactJavaScript.
    </marquee>
</body>
</html>
