<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollableBasketBall</title>
</head>
<body>
    <!-- scrollable basketball outer marquee -->
    <marquee behavior="alternate" direction="right" style="background-color: peachpuff;border-radius: 50px;">
        <!-- scrollable basketball inner marquee -->
        <marquee behavior="alternate" direction="down" style="height: 624px;">
            <img style="width: 200px;" src="../../assets/images/BasketBall.png" alt="BasketBallImage">
        </marquee>
    </marquee>
</body>
</html>
