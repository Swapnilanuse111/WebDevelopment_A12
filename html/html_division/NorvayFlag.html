<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norway Flag</title>
</head>

<body>

    <!-- Norway Flag Container -->
    <div style="width:900px;height:600px;background-color:red;">

        <!-- Top Section -->
        <div style="width:900px;height:250px;">

            <!-- Left Top -->
            <div style="width:250px;height:250px;background-color:red;float:left;"></div>

            <!-- White Vertical -->
            <div style="width:50px;height:250px;background-color:white;float:left;"></div>

            <!-- Blue Vertical -->
            <div style="width:50px;height:250px;background-color:darkblue;float:left;"></div>

            <!-- White Vertical -->
            <div style="width:50px;height:250px;background-color:white;float:left;"></div>

            <!-- Right Top -->
            <div style="width:500px;height:250px;background-color:red;float:left;"></div>

        </div>

        <!-- Middle Section -->
        <div style="width:900px;height:100px;">

            <!-- Left -->
            <div style="width:250px;height:100px;background-color:white;float:left;"></div>

            <!-- White -->
            <div style="width:50px;height:100px;background-color:white;float:left;"></div>

            <!-- Blue -->
            <div style="width:50px;height:100px;background-color:darkblue;float:left;"></div>

            <!-- White -->
            <div style="width:50px;height:100px;background-color:white;float:left;"></div>

            <!-- Right -->
            <div style="width:500px;height:100px;background-color:white;float:left;"></div>

        </div>

        <!-- Bottom Section -->
        <div style="width:900px;height:250px;">

            <!-- Left Bottom -->
            <div style="width:250px;height:250px;background-color:red;float:left;"></div>

            <!-- White Vertical -->
            <div style="width:50px;height:250px;background-color:white;float:left;"></div>

            <!-- Blue Vertical -->
            <div style="width:50px;height:250px;background-color:darkblue;float:left;"></div>

            <!-- White Vertical -->
            <div style="width:50px;height:250px;background-color:white;float:left;"></div>

            <!-- Right Bottom -->
            <div style="width:500px;height:250px;background-color:red;float:left;"></div>

        </div>

    </div>

</body>
</html>
