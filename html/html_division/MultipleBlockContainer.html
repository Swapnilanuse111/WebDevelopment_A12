<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultipleBlocksContainer</title>
</head>
<body>
    <!-- Main Container -->
    <div style="width:100%; height:634px; font-size:50px; text-align:center; font-family:sans-serif;">
        <!-- Header -->
        <div style="width:100%; height:15%; background-color:peachpuff;">Header</div>
        <!-- Aside Container -->
        <div style="width:25%; height:65%; float:left;">
            <div style="width:100%; height:50%; background-color:lightblue;">AsideOne</div>
            <div style="width:100%; height:50%; background-color:navy; color:white;">AsideTwo</div>
        </div>
        <!-- Main Content Container -->
        <div style="width:75%; height:65%; float:right;">
            <!-- First Row -->
            <div style="width:25%; height:33.3%; background-color:beige; float:left;">DOne</div>
            <div style="width:25%; height:33.3%; background-color:palegoldenrod; float:left;">DTwo</div>
            <div style="width:25%; height:33.3%; background-color:burlywood; float:left;">DThree</div>
            <div style="width:25%; height:33.3%; background-color:brown; color:white; float:left;">DFour</div>
            <!-- Second Row -->
            <div style="width:33.33%; height:33.3%; background-color:orange; float:left;">DFive</div>
            <div style="width:33.33%; height:33.3%; background-color:white; float:left;">DSix</div>
            <div style="width:33.34%; height:33.3%; background-color:green; color:white; float:left;">DSeven</div>
            <!-- Third Row -->
            <div style="width:20%; height:33.4%; background-color:green; float:left;">DEight</div>
            <div style="width:20%; height:33.4%; background-color:white; float:left;">DNine</div>
            <div style="width:20%; height:33.4%; background-color:red; color:white; float:left;">DTen</div>
            <div style="width:20%; height:33.4%; background-color:navy; color:white; float:left;">DEleven</div>
            <div style="width:20%; height:33.4%; background-color:lightgray; float:left;">DTwelve</div>
        </div>
        <!-- Clear Floats -->
        <div style="clear:both;"></div>
        <!-- Footer -->
        <div style="width:100%; height:20%; background-color:black; color:white;">Footer</div>
    </div>
</body>
</html>
