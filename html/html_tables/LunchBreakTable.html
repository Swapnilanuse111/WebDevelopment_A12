<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunchBreakTable</title>
</head>
<body>
    <!-- lunch break table -->
    <table>
        <!-- lunch break table caption -->
        <caption style="font-size: 50px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;color: orange;background-color: black;">LunchBreakTable</caption>
        <!-- lunch break table body -->
        <tbody style="font-size: 35px;font-family: sans-serif;background-color: peachpuff;text-align: center;">
            <!-- lunck break table body rows -->
            <!-- first row -->
            <tr>
                <td>Science</td>
                <td style="font-size: 45px;background-color: lightgray;" rowspan="3">L<br>U<br>N<br>C<br>H<br> B<br>R<br>E<br>A<br>K</td>
                <td>Physics</td>
            </tr>
            <!-- second row -->
            <tr>
                <td>Social<br>Science</td>
                <td>Chemistry</td>
            </tr>
            <!-- third row -->
            <tr>
                <td>Mathematics</td>
                <td>Biology</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
