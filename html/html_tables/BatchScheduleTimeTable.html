<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BatchScheduleTimeTable</title>
</head>
<body>
    <!-- batch schedule time table -->
    <table>
        <!-- batch schedule table caption -->
        <caption style="font-size: 50px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background-color: rgb(41, 64, 239);color: aliceblue;">
            Batch Schedule Time Table
        </caption>
        <!-- batch schedule table head -->
        <thead style="font-size: 35px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background-color: rgb(242, 47, 79);color: aliceblue;">
            <!-- batch schedule table head rows -->
            <!-- first row -->
            <tr>
                <th>CourseName</th>
                <th>TrainerName</th>
                <th>BatchCode</th>
                <th>BatchTime</th>
            </tr>
        </thead>
        <!-- batch schedule table body -->
        <tbody style="font-size: 25px; font-family: sans-serif;">
            <!-- batch schedule table body rows -->
            <!-- first row -->
            <tr style="background-color: lavender;">
                <td>SQL</td>
                <td>ManishaMam</td>
                <td>M13</td>
                <td>08:00 - 10:00</td>
            </tr>
            <!-- second row -->
            <tr style="background-color: lavenderblush;">
                <td>WebDevelopment</td>
                <td>Y</td>
                <td>A12</td>
                <td>12:00 - 14:00</td>
            </tr>
            <!-- third row -->
            <tr style="background-color: lavender;">
                <td>CoreJava</td>
                <td>NandhishSir</td>
                <td>M126</td>
                <td>14:30 - 16:30</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
