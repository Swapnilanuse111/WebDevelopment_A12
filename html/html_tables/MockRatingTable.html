<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockRatingTable</title>
</head>

<body>

    <!-- mock rating table -->
    <table>

        <!-- mock rating table caption -->
        <caption
            style="font-size:50px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:orange;background-color:black;">
            <b>MockRatingTable</b>
        </caption>

        <!-- mock rating table head -->
        <thead
            style="font-size:35px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:peachpuff;">

            <!-- first row -->
            <tr>
                <th rowspan="2">Serial<br>Number</th>
                <th rowspan="2">Student<br>Name</th>
                <th colspan="4">MockRatings</th>
                <th rowspan="2">Remarks</th>
            </tr>

            <!-- second row -->
            <tr>
                <th>HTML</th>
                <th>CSS</th>
                <th>JavaScript</th>
                <th>React<br>JavaScript</th>
            </tr>

        </thead>

        <!-- mock rating table body -->
        <tbody style="font-size:25px;font-family:sans-serif;">

            <!-- first row -->
            <tr style="background-color:lightgray;">
                <td>01</td>
                <td>Swapnil</td>
                <td>**</td>
                <td>*</td>
                <td>1</td>
                <td>1</td>
                <td>Please, improve your deliverence.</td>
            </tr>

            <!-- second row -->
            <tr style="background-color:darkgray;">
                <td>02</td>
                <td>Rahul</td>
                <td>*</td>
                <td>*</td>
                <td>*</td>
                <td>*</td>
                <td>Improve Confidence.</td>
            </tr>

            <!-- third row -->
            <tr style="background-color:lightgray;">
                <td>03</td>
                <td>RutikSargar</td>
                <td>3</td>
                <td>2</td>
                <td>3</td>
                <td>-</td>
                <td>Please, attend WebDevelopment batch again.</td>
            </tr>

        </tbody>

    </table>

</body>

</html>
