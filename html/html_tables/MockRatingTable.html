<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MockRatingTable</title>
</head>
<body>
    <!-- mock rating table -->
    <table>
        <!-- mock rating table caption -->
        <caption style="font-size: 50px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;color: orange;background-color: black;"><b>MockRatingTable</b></caption>
        <!-- mock rating table head -->
        <thead style="font-size: 35px;font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;background-color: peachpuff;">
            <!-- mock rating table head rows -->
            <!-- first row -->
            <tr>
                <!-- mock rating table head cells -->
                <th rowspan="2">Serial<br>Number</th>
                <th rowspan="2">Student<br>Name</th>
                <th colspan="4">MockRatings</th>
                <th rowspan="2">Remarks</th>
            </tr>
            <!-- second row -->
            <tr>
                <!-- mock rating table head cells -->
                <th>HTML</th>
                <th>CSS</th>
                <th>JavaScript</th>
                <th>React<br>JavaScript</th>
            </tr>
        </thead>
        <!-- mock rating table body -->
        <tbody style="font-size: 25px;font-family: sans-serif;">
            <!-- mock rating table body rows -->
            <!-- first row -->
            <tr style="background-color: lightgray;">
                <!-- mock rating table body cells -->
                <td>01</td>
                <td>Sai</td>
                <td>**</td>
                <td>*</td>
                <td>1</td>
                <td>1</td>
                <td>Please, improve your deliverence.</td>
            </tr>
            <!-- second row -->
            <tr style="background-color: darkgray;">
                <!-- mock rating table body cells -->
                <td>02</td>
                <td>Dhanashree</td>
                <td>*</td>
                <td>*</td>
                <td>*</td>
                <td>*</td>
                <td>Improve Confidence.</td>
            </tr>
            <!-- third row -->
            <tr style="background-color: lightgray;">
                <!-- mock rating table body cells -->
                <td>03</td>
                <td>PawanSingh</td>
                <td>3</td>
                <td>2</td>
                <td>3</td>
                <td>-</td>
                <td>Please, attend WebDevelopment batch again.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
