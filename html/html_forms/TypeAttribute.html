<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeAttribute</title>
</head>
<body style="font-size: 20px;font-family: sans-serif;">
    <form action="">
        <!-- table inside form table -->
        <table>
            <!-- html form table body -->
            <tbody>
                <!-- html form table body rows -->
                <!-- first row -->
                <tr>
                    <td><label for="">Username</label></td>
                    <td><input type="text" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- second row -->
                <tr>
                    <td><label for="">Password</label></td>
                    <td><input type="password" style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                </tr>
                <!-- third row -->
                <tr>
                    <td><label for="">EmailUsername</label></td>
                    <td><input type="email" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- fourth row -->
                <tr>
                    <td><label for="">Age</label></td>
                    <td><input type="number" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- fifth row -->
                <tr>
                    <td><label for="">MobileNumber</label></td>
                    <td><input type="tel" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- sixth row -->
                <tr>
                    <td><label for="">ChooseColor</label></td>
                    <td><input type="color" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- seventh row -->
                <tr>
                    <td><label for="">Brightness</label></td>
                    <td><input type="range" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- eight row -->
                <tr>
                    <td><label for="">PickDate</label></td>
                    <td><input type="date" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- nineth row -->
                <tr>
                    <td><label for="">PickTime</label></td>
                    <td><input type="time" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- tenth row -->
                <tr>
                    <td><label for="">PickWeek</label></td>
                    <td><input type="week" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- eleventh row -->
                <tr>
                    <td><label for="">YearOfPassedOut</label></td>
                    <td><input type="month" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- twelveth row -->
                <tr>
                    <td><label for="">PickDateTime</label></td>
                    <td><input type="datetime-local" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- thirteenth row -->
                <tr>
                    <td><label for="">Search</label></td>
                    <td><input type="search" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- fourteenth row -->
                <tr>
                    <td><label for="">UploadSongRecording</label></td>
                    <td><input type="file" style="font-size: 20px;outline: none;border: none;background-color: lightgray;border-radius: 5px;"/></td>
                </tr>
                <!-- fifteenth row -->
                <tr>
                    <td><label for="">Gender</label></td>
                    <td>
                        <input type="radio" name="gender" style="width: 15px;height: 15px;"/><span>Male</span>
                        <br/>
                        <input type="radio" name="gender" style="width: 15px;height: 15px;"/><span>Female</span>
                        <br/>
                        <input type="radio" name="gender" style="width: 15px;height: 15px;"/><span>TransGender</span>
                        <br/>
                        <input type="radio" name="gender" style="width: 15px;height: 15px;"/><span>TransWomen</span>
                    </td>
                </tr>
                <!-- sixteenth row -->
                <tr>
                    <td><label for="">SkillSets</label></td>
                    <td>
                        <input type="checkbox" name="skillSets" style="width: 15px;height: 15px;"/><span>HTML</span>
                        <br/>
                        <input type="checkbox" name="skillSets" style="width: 15px;height: 15px;"/><span>CSS</span>
                        <br/>
                        <input type="checkbox" name="skillSets" style="width: 15px;height: 15px;"/><span>JavaScript</span>
                        <br/>
                        <input type="checkbox" name="skillSets" style="width: 15px;height: 15px;"/><span>ReactJavaScript</span>
                    </td>
                </tr>
                <!-- seventeenth row -->
                <tr>
                    <td><input type="submit" style="font-size: 25px;background-color: lightgray;border: none;outline: none;border-radius: 5px;"/></td>
                    <td><input type="reset" style="font-size: 25px;background-color: lightgray;border: none;outline: none;border-radius: 5px;"/></td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
