<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TypeAttributeHtml</title>
    </head>
    <body style="font-size: 25px;font-family: sans-serif;">
        <form action="">
            <!-- table inside form table-->
            <!-- table inside form table-->
            <table>
                <!-- HTML from table body-->
                <tbody>
                    <!-- HTML form table body rows-->
                    <!-- first row-->
                    <tr>
                        <td><label for="">Username</label></td>
                        <td><input style="font-size: 20px;outline: none;border: none;background-color:lightgray;border-radius: 5px;" type="text"></td>
                    </tr>
                    <!-- secoend row -->
                     <tr>
                        <td><label for="">Password</label></td>
                        <td><input style="background-color: lightgray;font-size: 20px;border: none;border-radius: 5px;" type="password"></td>
                    </tr>
                     <!-- Third Row  -->
                    <tr>
                      <td><label for=""></label>EmailUsername</td>
                      <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;" type="email"></td>
                    </tr>
                      <!-- fourth row -->
                    <tr>
                        <td><label for="">Age</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;" type="text"></td>
                    </tr>
                       <!-- fifth row -->
                    <tr>
                        <td><label for="">Mobile Number</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="tel"></td>
                    </tr>
                       <!-- Sixth row -->
                    <tr>
                        <td><label for="">Choese Color</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="color"></td>
                    </tr>
                       <!-- Eight row -->
                    <tr>
                        <td><label for="">Peak date</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="date"></td>
                    </tr>
                       <!-- nineth row -->
                    <tr>
                        <td><label for="">Peak Time</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="time"></td>
                    </tr>
                       <!-- 10th row -->
                    <tr>
                        <td><label for="">peakWeek</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="week"></td>
                    </tr>
                       <!-- 11th row -->
                    <tr>
                        <td><label for="">YearOfPassOut</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="month"></td>
                    </tr>
                       <!-- 12th row -->
                    <tr>
                        <td><label for="">PickDateTime</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="datetime-local"></td>
                    </tr>
                       <!-- 13th row -->
                    <tr>
                        <td><label for="">Search</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="search"></td>
                    </tr>
                       <!-- 14th row -->
                    <tr>
                        <td><label for="">UplodedSongRecord</label></td>
                        <td><input style="background-color: lightgray;font-size: 25px;border-radius: 5px;border: none;"  type="file"></td>
                    </tr>
                       <!-- Fifteenth Row -->
                    <tr>
                        <td><label>Gender</label></td>
                        <td>
                            <input type="radio" id="male" name="gender" value="Male" style="width:15px; height:15px;">
                            <label for="male">Male</label><br>

                            <input type="radio" id="female" name="gender" value="Female" style="width:15px; height:15px;">
                            <label for="female">Female</label><br>

                            <input type="radio" id="transgender" name="gender" value="Transgender" style="width:15px; height:15px;">
                            <label for="transgender">Transgender</label><br>

                            <input type="radio" id="transwoman" name="gender" value="TransWoman" style="width:15px; height:15px;">
                            <label for="transwoman">TransWoman</label>
                        </td>
                    </tr>
                    <!-- Sixteenth Row -->
                    <tr>
                        <td><label>Skill Sets</label></td>
                        <td>
                            <input type="checkbox" id="html" name="skillSets" value="HTML">
                            <label for="html">HTML</label><br>

                            <input type="checkbox" id="css" name="skillSets" value="CSS">
                            <label for="css">CSS</label><br>

                            <input type="checkbox" id="javascript" name="skillSets" value="JavaScript">
                            <label for="javascript">JavaScript</label><br>

                            <input type="checkbox" id="react" name="skillSets" value="ReactJS">
                            <label for="react">React JavaScript</label>
                        </td>
                    </tr>
                    <tr>
                        <td><input style="background-color: lightgray;border-radius: 5px;border: none;font-size: 25px;" type="submit"></td>
                        <td><input style="background-color: lightgray;border-radius: 5px;border: none;font-size: 25px;" type="reset"></td>
                    </tr>
                    </tr>
                 </tbody>
            </table>
        </form>
    </body>
    </html>
