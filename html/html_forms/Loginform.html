<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginForm</title>
</head>
<body style="font-size:20px;font-family:sans-serif;">

<form action="https://www.facebook.com/login" target="_blank">

<table>

<caption style="font-size:50px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,'Open Sans','Helvetica Neue',sans-serif;font-weight:bold;">LoginForm</caption>

<tbody>

<tr>
<td><label for="username_inputbox">Username</label></td>
<td><input type="text" id="username_inputbox" name="username" placeholder="Enter Username" style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"></td>
</tr>

<tr>
<td><label for="password_inputbox">Password</label></td>
<td><input type="password" id="password_inputbox" name="password" placeholder="Enter Password" style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"></td>
</tr>

<tr>
<td colspan="2">
<input type="submit" value="Login" style="font-size:25px;border:none;outline:none;border-radius:5px;background-color:lightgray;">
<a href="https://www.facebook.com/reg/?entry_point=login&next=" target="_blank"><button type="button" style="font-size:25px;border:none;outline:none;border-radius:5px;background-color:lightgray;">CreateAccount</button></a>
<input type="reset" value="Cancel" style="font-size:25px;border:none;outline:none;border-radius:5px;background-color:lightgray;">
</td>
</tr>

</tbody>

</table>

</form>

</body>
</html>
