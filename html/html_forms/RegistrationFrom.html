<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistrationForm</title>
</head>

<body style="font-size:20px;font-family:sans-serif;">

<fieldset style="width:fit-content;border:3px solid black;">
<legend style="font-size:50px;text-align:center;">RegistrationForm</legend>

<form action="">

<table>
<tbody>

<!-- first row -->
<tr>
<td><input type="text" name="firstName" id="first_name_inputfield" placeholder="FirstName" required autofocus style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- second row -->
<tr>
<td><input type="text" name="middleName" id="middle_name_inputfield" placeholder="MiddleName" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- third row -->
<tr>
<td><input type="text" name="lastName" id="last_name_inputfield" placeholder="LastName" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- fourth row -->
<tr>
<td><input type="number" name="aadhaarCardNumber" id="aadhaar_card_number_inputfield" placeholder="AadhaarCardNumber" value="289704044331" required readonly style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- fifth row -->
<tr>
<td><input type="text" name="panCardNumber" id="pan_card_number_inputfield" placeholder="PanCardNumber" value="F5YU123EDY" required readonly style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- sixth row -->
<tr>
<td><input type="text" name="otp" id="otp2" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
<td><input type="text" name="otp" id="otp2" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
<td><input type="text" name="otp" id="otp3" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
<td><input type="text" name="otp" id="otp4" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
<td><input type="text" name="otp" id="otp5" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
<td><input type="text" name="otp" id="otp6" minlength="1" maxlength="1" required style="font-size:20px;text-align:center;outline:none;border:none;border-radius:5px;background-color:lightgray;width:20px;"/></td>
</tr>
<!-- Seventh Row -->
<tr>
<td><input type="button" value="ValidateOTP" style="font-size:20px;border:none;border-radius:5px;background-color:lightgray;cursor:pointer;"/></td>
</tr>

<!-- Eighth Row -->
<tr>
<td><input type="time" name="time" id="time_inputfield" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- Ninth Row -->
<tr>
<td><input type="date" name="dob" id="dob_inputfield" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- Tenth Row -->
<tr>
<td><input type="number" name="age" id="age_inputfield" placeholder="EligibilityAge" min="18" max="60" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- Eleventh Row -->
<tr>
<td><textarea name="address" id="address_inputfield" rows="5" cols="20" placeholder="ResidentialAddress" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;resize:none;"></textarea></td>
</tr>

<!-- Twelfth Row -->
<tr>
<td>
<select name="city" id="city_inputfield" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;">
<option value="">--Select City--</option>
<option value="Pune">Pune</option>
<option value="Mumbai">Mumbai</option>
<option value="Kolhapur">Kolhapur</option>
<option value="Sangli">Sangli</option>
<option value="Satara">Satara</option>
</select>
</td>
</tr>

<!-- Thirteenth Row -->
<tr>
<td><input type="text" name="course" id="course_inputfield" placeholder="Course" required style="font-size:20px;outline:none;border:none;border-radius:5px;background-color:lightgray;"/></td>
</tr>

<!-- Fourteenth Row -->
<tr>
<td><input type="submit" value="Register" style="font-size:20px;border:none;border-radius:5px;background-color:lightgray;cursor:pointer;"/></td>
<td><input type="reset" value="Cancel" style="font-size:20px;border:none;border-radius:5px;background-color:lightgray;cursor:pointer;"/></td>
</tr>
</tbody>
</table>

</form>

</fieldset>

</body>
</html>
