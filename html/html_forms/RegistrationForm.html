<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistrationForm</title>
</head>
<body style="font-size: 20px;font-family: sans-serif;">
    <!-- registration form -->
    <fieldset style="width: fit-content;border: 3px solid black;">
        <legend style="font-size: 50px;text-align: center;">RegistrationForm</legend>
        <form action="">
            <!-- html table inside form -->
            <table>
                <!-- html form table body -->
                <tbody>
                    <!-- html form table body rows -->
                    <!-- first row -->
                    <tr>
                        <td><input type="text" name="firstName" id="first_name_inputfield" placeholder="FirstName" required autofocus style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- second row -->
                    <tr>
                        <td><input type="text" name="middleName" id="middle_name_inputfield" placeholder="MiddleName" required style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- third row -->
                    <tr>
                        <td><input type="text" name="lastName" id="last_name_inputfield" placeholder="LastName" required style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- fourth row -->
                    <tr>
                        <td><input type="number" name="aadhaarCardNumber" id="aadhar_card_number_inputfield" placeholder="AadharCardNumber" value="289704044331" required readonly style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- fifth row -->
                    <tr>
                        <td><input type="text" name="panCardNumber" id="pan_card_number_inputfield" placeholder="PanCardNumber" value="F5YU123EDY" required readonly style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- sixth row -->
                    <tr>
                        <td>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                            <input type="text" name="otp" id="otp_inputfield" minlength="1" maxlength="1" required style="font-size: 20px;text-align: center;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 20px;"/>
                        </td>
                    </tr>
                    <!-- seventh row -->
                    <tr>
                        <td><input type="button" value="ValidateOTP" disabled style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- eight row -->
                    <tr>
                        <td><input type="time" name="time" id="time_inputfield" min="06:00" max="18:00" required style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- nineth row -->
                    <tr>
                        <td><input type="date" name="date" id="date_inputfield" min="2026-07-12" required max="2026-07-18" style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                    <!-- tenth row -->
                    <tr>
                        <td><input type="number" name="eligibilityAge" id="eligibility_age_inputfield" required min="21" max="32" placeholder="EligibilityAge" style="font-size: 20px;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 240px;"/></td>
                    </tr>
                    <!-- eleventh row -->
                    <tr>
                        <td><textarea name="residentialAddress" id="residential_address_textarea_inputfield" required placeholder="ResidentialAddress" style="font-size: 20px;font-family: sans-serif;resize: none;outline: none;border: none;border-radius: 5px;background-color: lightgray;width: 240px;height: 100px"></textarea></td>
                    </tr>
                    <!-- twelveth row -->
                    <tr>
                        <td>
                            <select name="city" id="city_drop_down_list" required style="font-size: 25px;border: none;outline: none;border-radius: 5px;background-color: lightgray;">
                                <option>--Select City--</option>
                                <optgroup label="Maharashtra">
                                    <option>Pune</option>
                                    <option>Mumbai</option>
                                    <option>Nashik</option>
                                </optgroup>
                                <optgroup label="Karnataka">
                                    <option>Bengaluru</option>
                                    <option>Mangaluru</option>
                                    <option>Mandya</option>
                                </optgroup>
                                <optgroup label="AndhraPradesh">
                                    <option>Hyderabad</option>
                                    <option>Thirupathi</option>
                                    <option>Vijayawada</option>
                                </optgroup>
                            </select>
                        </td>
                    </tr>
                    <!-- thirteenth row -->
                    <tr>
                        <td>
                            <input type="text" name="course" id="course_inputfield" list="course_datalist" placeholder="Course" style="font-size: 25px;border: none;outline: none;border-radius: 5px;background-color: lightgray;"/>
                            <datalist id="course_datalist" required>
                                <option>HTML</option>
                                <option>CSS</option>
                                <option>JavaScript</option>
                                <option>ReactJavaScript</option>
                                <option>CoreJava</option>
                                <option>CorePython</option>
                                <option>AdvancedJava</option>
                                <option>AdvancedPython</option>
                                <option>SQL</option>
                                <option>DataScience</option>
                                <option>DataAnalytics</option>
                                <option>AIML</option>
                            </datalist>
                        </td>
                    </tr>
                    <!-- last row -->
                    <tr>
                        <td><input type="submit" value="Register" style="font-size: 25px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                        <td><input type="reset" value="Cancel" style="font-size: 25px;outline: none;border: none;border-radius: 5px;background-color: lightgray;"/></td>
                    </tr>
                </tbody>
            </table>
        </form>
    </fieldset>
</body>
</html>
