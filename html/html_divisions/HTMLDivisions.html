<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMLDivisions</title>
</head>
<body style="font-size: 25px;font-family: sans-serif;">
    <!-- content approach -->
    <div style="color: white;background-color: red;">
        FirstTextContent.
        <br>
        SecondTextContent.
        <br>
        ThirdTextContent.
        <br>
        FourthTextContent.
        <br>
        FifthTextContent.
    </div>
    <br>
    <!-- dimensioned approach -->
    <div style="width: 100px;height: 100px;background-color: navy;float: right;"></div>
    <div style="width: 100px;height: 100px;background-color: lightgray;float: right;"></div>
    <div style="width: 100px;height: 100px;background-color: black;float: right;"></div>
</body>
</html>
