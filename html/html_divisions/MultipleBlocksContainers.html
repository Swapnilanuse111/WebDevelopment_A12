<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultipleBlocksContainer</title>
</head>
<body>
    <!-- multiple blocks container -->
    <div style="width: 100%;height: 634px;font-size: 50px;text-align: center;font-family: sans-serif;">
        <!-- multiple blocks -->
        <!-- header block -->
        <div style="width: 100%;height: 15%;background-color: peachpuff;">Header</div>
        <!-- aside blocks container -->
        <div style="width: 25%;height: 65%;float: left;">
            <!-- aside blocks -->
            <div style="width: 100%;height: 50%;background-color: lightblue;">AsideOne</div>
            <div style="width: 100%;height: 50%;color: white;background-color: navy;">AsideTwo</div>
        </div>
        <!-- div blocks container -->
        <div style="width: 75%;height: 65%;float: right;">
            <!-- div blocks -->
            <div style="width: 25%;height: 33.3%;background-color: beige;float: left;">DOne</div>
            <div style="width: 25%;height: 33.3%;background-color: palegoldenrod;float: left;">DTwo</div>
            <div style="width: 25%;height: 33.3%;background-color: burlywood;float: left;">DThree</div>
            <div style="width: 25%;height: 33.3%;color: white;background-color: brown;float: right;">DFour</div>
            <div style="width: 33.3%;height: 33.3%;background-color: orange;float: left;">DFive</div>
            <div style="width: 33.3%;height: 33.3%;background-color: white;float: left;">DSix</div>
            <div style="width: 33.3%;height: 33.3%;background-color: green;float: right;">DSeven</div>
            <div style="width: 20%;height: 33.4%;background-color: green;float: left;">DEight</div>
            <div style="width: 20%;height: 33.4%;background-color: white;float: left;">DNine</div>
            <div style="width: 20%;height: 33.4%;color: white;background-color: red;float: left;">DTen</div>
            <div style="width: 20%;height: 33.4%;color: white;background-color: navy;float: left;">DEleven</div>
            <div style="width: 20%;height: 33.4%;background-color: lightgray;float: right;">DTwelve</div>
        </div>
        <!-- footer block -->
        <div style="width: 100%;height: 20%;color: white;background-color: black;float: right;">Footer</div>
    </div>
</body>
</html>
