<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W3SchoolsHomePageStructure</title>
</head>

<body>

    <!-- w3 schools home page structure blocks container -->
    <div style="font-size:50px;font-family:sans-serif;text-align:center;width:100%;height:634px;background-color:hotpink;">

        <!-- header container -->
        <header style="width:100%;height:15%;background-color:peachpuff;">
            Header
        </header>

        <!-- navigation bar -->
        <nav style="width:100%;height:10%;background-color:lightblue;">
            NavigationBar
        </nav>

        <!-- left aside container -->
        <aside style="width:25%;height:65%;background-color:lightgray;float:left;">
            Aside
        </aside>

        <!-- main container -->
        <main style="width:50%;height:65%;background-color:gray;float:left;">
            Main

            <!-- section container -->
            <section>

                <!-- article container -->
                <article></article>

                <!-- figure container -->
                <figure></figure>

            </section>

        </main>

        <!-- right aside container -->
        <aside style="width:25%;height:65%;background-color:lightgray;float:right;">
            Aside
        </aside>

        <!-- footer container -->
        <footer style="width:100%;height:10%;background-color:black;color:gray;float:right;">
            Footer &copy; Copyrights reserved &middot;2026
        </footer>

    </div>

</body>
</html>
