<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeDetailsTable</title>
    <link rel="stylesheet" href="EmployeeDetailsTable.css"/>
    <script src="EmployeeDetailsTable.js" defer></script>
</head>
<body>
    <table id="employee_details_table">
        <caption id="employee_details_table_caption">EmployeeDetails</caption>
        <tbody id="employee_details_table_body">
            <!-- first row -->
            <tr class="employee_details_table_body_rows odd_rows">
                <td class="employee_details_table_body_cells">EmployeeName</td>
                <td class="employee_details_table_body_cells" id="employee_name_cell"></td>
            </tr>
            <!-- second row -->
            <tr class="employee_details_table_body_rows even_rows">
                <td class="employee_details_table_body_cells">EmployeeAge</td>
                <td class="employee_details_table_body_cells" id="employee_age_cell"></td>
            </tr>
            <!-- third row -->
            <tr class="employee_details_table_body_rows odd_rows">
                <td class="employee_details_table_body_cells">EmployeeSalary(in LPA)</td>
                <td class="employee_details_table_body_cells" id="employee_salary_cell"></td>
            </tr>
            <!-- fourth row -->
            <tr class="employee_details_table_body_rows even_rows">
                <td class="employee_details_table_body_cells">EmployeeDesignation</td>
                <td class="employee_details_table_body_cells" id="employee_designation_cell"></td>
            </tr>
            <!-- fifth row -->
            <tr class="employee_details_table_body_rows odd_rows">
                <td class="employee_details_table_body_cells">EmployeeJobLocation</td>
                <td class="employee_details_table_body_cells" id="employee_job_location_cell"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
