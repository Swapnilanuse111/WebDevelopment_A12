<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MountainTransitionedLoginPages</title>
    <link rel="stylesheet" href="MountainTransitionedLoginPages.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div id="login_page_container">
        <h1 id="welcome_message_heading">Welcome Back<br/>User</h1>
        <form action="" id="login_form_container">
            <input type="text" name="username" id="username_input_field" class="input_fields" placeholder="Username"/>
            <input type="password" name="password" id="password_input_field" class="input_fields" placeholder="Password"/>
            <input type="submit" value="LOGIN" id="login_button">
        </form>
        <fieldset id="or_fieldset">
            <legend id="or_fieldset_legend">OR</legend>
        </fieldset>
        <div id="sign_in_options_container">
            <span id="sign_in_statement">Sign-in using with </span>
            <div id="social_media_icon_blocks_container">
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-google social_media_icons" id="google_icon"></i>
                </span>
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-facebook social_media_icons" id="facebook_icon"></i>
                </span>
                <span class="social_media_icon_blocks">
                    <i class="fa-brands fa-instagram social_media_icons" id="instagram_icon"></i>
                </span>
            </div>
        </div>
    </div>
    <header id="mountain_header_container"></header>
</body>
</html>
